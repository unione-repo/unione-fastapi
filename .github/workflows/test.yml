# Generated: the tests of the package on every push and pull request (and before a release). Do not edit, the next
# release replaces it. The tests need no network: the API is faked.
name: Tests

on:
  push:
    branches: ["**"]  # not the tags: release.yml runs the tests of a tag itself
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 140
    strategy:
      fail-fast: false
      matrix:
        v: ["3.8", "3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the SDK unione-sdk 1.3.0 in PyPI
        timeout-minutes: 95
        run: |
          for i in $(seq 1 180); do
            if curl -fsSL -A "release-workflow (github.com/$GITHUB_REPOSITORY)" -o /tmp/sdk "https://pypi.org/pypi/unione-sdk/1.3.0/json"; then
              echo "unione-sdk 1.3.0 is in PyPI"; exit 0
            fi
            echo "unione-sdk 1.3.0 is not in PyPI yet ($i/180)"; sleep 30
          done
          echo "::error::unione-sdk 1.3.0 did not appear in PyPI in 90 min: publish the SDK first"; exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.v }}
      - name: Install the dependencies (the mirrors of the registry may serve the SDK some minutes later)
        timeout-minutes: 25
        run: |
          for i in $(seq 1 40); do
            if ( python -m pip install --no-cache-dir -e ".[test]" ); then exit 0; fi
            echo "the dependencies can not be installed yet ($i/40)"; sleep 30
          done
          echo "::error::the dependencies (the SDK) can not be installed in 20 min"; exit 1
      - run: |
          python -m pip install -e ".[test]" && python -m unittest discover -s tests -v
